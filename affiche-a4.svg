      <polygon points="9,11 52,11 22,22 0,22" fill="#DCE9F5" stroke="#16324F" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect x="-30" width="860" height="1200" fill="url(#bg)"/>

  <!-- Flocons -->
