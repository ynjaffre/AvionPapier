  <!-- Titre -->
  <text x="400" y="95" font-size="26" font-weight="bold" text-anchor="middle" fill="#FFD166" letter-spacing="9">GRAND CONCOURS</text>
  <line x1="250" y1="115" x2="550" y2="115" stroke="#FFD166" stroke-width="3"/>
  <g filter="url(#shadow)" font-weight="bold" text-anchor="middle" fill="#fff">
