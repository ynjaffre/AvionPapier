    <path d="M84 562 Q120 592 156 562" fill="none" stroke="#E53935" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 5"/>
    <g stroke-width="1.5">
      <circle cx="98" cy="540" r="6" fill="#E53935" stroke="#7A1010"/>
      <circle cx="120" cy="545" r="7" fill="#FFC107" stroke="#B26A00"/>
      <circle cx="142" cy="540" r="6" fill="#1E88E5" stroke="#0D47A1"/>
      <circle cx="102" cy="574" r="6" fill="#2E9E4F" stroke="#14532D"/>
      <circle cx="120" cy="581" r="7" fill="#E53935" stroke="#7A1010"/>
      <circle cx="138" cy="574" r="6" fill="#FFC107" stroke="#B26A00"/>
    </g>
    <g fill="#fff" opacity="0.8">
      <circle cx="96" cy="538" r="1.6"/><circle cx="117.5" cy="542.5" r="2"/><circle cx="140" cy="538" r="1.6"/>
      <circle cx="100" cy="572" r="1.6"/><circle cx="117.5" cy="578.5" r="2"/><circle cx="136" cy="572" r="1.6"/>
    </g>
    <line x1="150" y1="525" x2="188" y2="470" stroke="#F4A100" stroke-width="12" stroke-linecap="round"/>
    <line x1="150" y1="525" x2="188" y2="470" stroke="#FFE135" stroke-width="7" stroke-linecap="round"/>

