  <!-- Bandeau date -->
  <g filter="url(#shadow)">
    <rect x="40" y="800" width="720" height="96" rx="14" fill="#0B2E5C"/>
    <rect x="40" y="800" width="250" height="96" rx="14" fill="#FF9F1C"/>
    <rect x="270" y="800" width="20" height="96" fill="#FF9F1C"/>
  </g>
  <text x="165" y="868" font-size="64" font-weight="bold" text-anchor="middle" fill="#0B2E5C">17/12</text>
  <text x="530" y="844" font-size="40" font-weight="bold" text-anchor="middle" fill="#fff">13H15</text>
  <text x="530" y="876" font-size="23" font-weight="bold" text-anchor="middle" fill="#FFD166" letter-spacing="2">DANS LE DIFFUSEUR DE S1</text>

  <!-- Rendez-vous -->
  <rect x="40" y="912" width="720" height="64" rx="12" fill="#fff"/>
  <text x="400" y="955" font-size="25" text-anchor="middle" fill="#0B2E5C"><tspan font-weight="bold">Rendez-vous à 13h</tspan> dans le grand hall de S1 (avion / hélico)</text>

  <!-- Règles -->
  <rect x="40" y="990" width="720" height="150" rx="12" fill="#fff"/>
  <text x="68" y="1017" font-size="19" font-weight="bold" fill="#FF9F1C" letter-spacing="4">RÈGLES</text>
  <g fill="#0B2E5C">
    <circle cx="78" cy="1041" r="11"/><circle cx="78" cy="1069" r="11"/><circle cx="78" cy="1121" r="11"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="78" y="1046">1</text><text x="78" y="1074">2</text><text x="78" y="1126">3</text>
  </g>
  <g font-size="20" fill="#0B2E5C">
    <text x="102" y="1047">Avion en papier uniquement</text>
    <text x="102" y="1075">Déco libre (dessins, autocollants…) : <tspan font-weight="bold" fill="#E8590C">+3% sur la distance</tspan></text>
    <text x="102" y="1127">Lancer et envol depuis la porte du diffuseur</text>
  </g>
  <text x="102" y="1101" font-size="20" fill="#0B2E5C">Si déco « Noël » : <tspan font-weight="bold" fill="#E8590C">+5%</tspan> <tspan font-size="14" font-style="italic">(offre non cumulable et selon les conditions générales de vol)</tspan></text>

  <!-- Pied -->
  <rect x="-30" y="1146" width="860" height="54" fill="#FF9F1C"/>
  <text x="400" y="1182" font-size="26" font-weight="bold" text-anchor="middle" fill="#0B2E5C" letter-spacing="1">LE PLUS LOIN GAGNE LE PLUS GROS LOT</text>
</svg>
