    <circle cx="55" cy="50" r="4"/><circle cx="150" cy="95" r="3"/><circle cx="260" cy="40" r="5"/>
    <circle cx="380" cy="75" r="3"/><circle cx="520" cy="35" r="4"/><circle cx="640" cy="85" r="3"/>
    <circle cx="740" cy="45" r="5"/><circle cx="35" cy="200" r="5"/><circle cx="765" cy="215" r="4"/>
    <circle cx="90" cy="330" r="3"/><circle cx="720" cy="340" r="4"/><circle cx="60" cy="440" r="4"/>
    <circle cx="250" cy="470" r="3"/><circle cx="560" cy="480" r="3"/><circle cx="170" cy="520" r="4"/>
    <circle cx="620" cy="540" r="4"/><circle cx="330" cy="500" r="3"/><circle cx="470" cy="470" r="4"/>
    <circle cx="30" cy="620" r="4"/><circle cx="775" cy="600" r="4"/>
