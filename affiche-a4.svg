    <polygon fill="#FFC24B" stroke="#E8590C" stroke-width="3" stroke-linejoin="round"
      points="318,380 336,392 330,370 348,382 346,362 362,378 366,400 350,404 364,420 346,424 358,440 336,434 332,452 318,430 300,440 306,420 286,412 306,402 290,388 312,392"/>
    <polygon fill="#FFC24B" stroke="#E8590C" stroke-width="3" stroke-linejoin="round"
      points="482,380 464,392 470,370 452,382 454,362 438,378 434,400 450,404 436,420 454,424 442,440 464,434 468,452 482,430 500,440 494,420 514,412 494,402 510,388 488,392"/>
    <g fill="#fff" stroke="#16324F" stroke-width="1.5" stroke-linejoin="round">
