      <polygon points="330,475 348,466 346,486"/><polygon points="500,340 482,334 488,352"/>
      <polygon points="532,430 514,440 534,450"/><polygon points="470,478 452,470 454,490"/>
      <polygon points="442,318 456,326 438,334"/><polygon points="356,312 370,320 352,326"/>
    </g>

