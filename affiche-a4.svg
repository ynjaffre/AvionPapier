    </g>
    <circle cx="400" cy="420" r="11" fill="#2E4457"/>
    <g fill="none" stroke="#2E4457" stroke-width="2" opacity="0.5"><circle cx="400" cy="420" r="54"/><circle cx="400" cy="420" r="38"/></g>

