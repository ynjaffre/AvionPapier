    <polyline points="85,545 55,525 75,505 45,480 70,470 55,440" fill="none" stroke="#F4A100" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="120" cy="545" rx="38" ry="46" fill="#FFE135" stroke="#F4A100" stroke-width="3"/>
    <polygon points="95,420 80,360 120,405" fill="#FFE135" stroke="#F4A100" stroke-width="3"/>
    <polygon points="80,360 86,376 95,368" fill="#222"/>
    <polygon points="145,420 170,365 125,405" fill="#FFE135" stroke="#F4A100" stroke-width="3"/>
    <polygon points="170,365 160,383 150,375" fill="#222"/>
    <circle cx="120" cy="455" r="38" fill="#FFE135" stroke="#F4A100" stroke-width="3"/>
    <circle cx="106" cy="448" r="5" fill="#000"/><circle cx="136" cy="448" r="5" fill="#000"/>
    <circle cx="92" cy="465" r="8" fill="#F44336"/><circle cx="148" cy="465" r="8" fill="#F44336"/>
    <path d="M110 466 Q121 474 132 466" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
